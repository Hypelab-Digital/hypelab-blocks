<style>
  /* Mismo sistema visual que estadisticas-congreso-v1 (idéntico, sin conflicto si conviven). */
  .cdt-stats-v1 {
    background: #3C3C3B;
    padding: 48px 24px;
    font-family: "Roboto", "Helvetica Neue", Arial, sans-serif;
    box-sizing: border-box;
  }
  .cdt-stats-v1 *, .cdt-stats-v1 *::before, .cdt-stats-v1 *::after { box-sizing: border-box; }

  .cdt-stats-grid {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  .cdt-stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
  }
  .cdt-stat:not(:last-child)::after {
    content: "";
    position: absolute;
    top: 12%;
    right: -12px;
    height: 76%;
    width: 1px;
    background: rgba(255, 255, 255, 0.10);
  }

  .cdt-icon { margin-bottom: 14px; }
  .cdt-icon svg { width: 44px; height: 44px; display: block; }

  .cdt-num { font-family: "Bebas Neue", "Roboto", sans-serif; font-size: 64px; font-weight: 400; line-height: 0.95; letter-spacing: 0.5px; color: #77FB9F; }
  .cdt-label {
    margin-top: 10px; color: #ffffff; font-size: 16px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .cdt-sub { margin-top: 6px; color: rgba(255, 255, 255, 0.55); font-size: 13px; line-height: 1.3; }

  @media (max-width: 767px) {
    .cdt-stats-v1 { padding: 36px 16px; }
    .cdt-stats-grid { grid-template-columns: 1fr; gap: 30px; max-width: 320px; }
    .cdt-num { font-size: 56px; }
    .cdt-stat:not(:last-child)::after {
      top: auto; right: auto; bottom: -15px; left: 25%;
      height: 1px; width: 50%;
    }
  }
</style>
